name: smart_expense_manager
description: Personal expense manager app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  google_sign_in: ^7.2.0
  http: ^1.2.2
  intl: ^0.20.2
  fl_chart: ^1.2.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2
  local_auth: ^3.0.1
  path_provider: ^2.1.5
  file_picker: ^10.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo/nbexpensemanager_launcher.png
  min_sdk_android: 21
  adaptive_icon_background: "#1E2A78"
  adaptive_icon_foreground: assets/logo/nbexpensemanager_launcher.png
